<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sammu Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --glass-bg: rgba(28, 28, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --outgoing-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
            --incoming-bg: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
        }
        @keyframes discoParty {
            0% { background-color: #1e1b4b; }
            25% { background-color: #311042; }
            50% { background-color: #062f22; }
            75% { background-color: #4c0519; }
            100% { background-color: #1e1b4b; }
        }
        .disco-active { animation: discoParty 1.5s linear infinite !important; }
        @keyframes spinBlade { 100% { transform: translate(-22px,-22px) rotate(360deg); } }
        
        #chat-area {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px; height: 280px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
            margin-bottom: 6px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }
        .msg-bubble {
            max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.92rem;
            line-height: 1.4; color: var(--text-main); word-break: break-word;
            display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            animation: bubblePop 0.2s ease-out forwards;
        }
        @keyframes bubblePop {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .bubble-container { display: flex; flex-direction: column; width: 100%; margin: 2px 0; }
        .msg-container-outgoing { align-items: flex-end; }
        .msg-container-outgoing .msg-bubble { background: var(--outgoing-gradient); border-bottom-right-radius: 4px; }
        .msg-container-incoming { align-items: flex-start; }
        .msg-container-incoming .msg-bubble { background: var(--incoming-bg); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .msg-sender-title { font-size: 0.78rem; color: #a5b4fc; margin-bottom: 3px; padding: 0 4px; font-weight: 700; }
        .msg-container-system { align-items: center; text-align: center; }
        .msg-container-system .msg-bubble { background: rgba(252, 211, 77, 0.1); border: 1px solid rgba(252, 211, 77, 0.2); color: #fcd34d; font-size: 0.8rem; padding: 4px 12px; border-radius: 20px; }
        
        .chirp-row { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding: 2px 0; }
        .chirp-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; padding: 6px 12px; border-radius: 14px; font-size: 0.78rem; white-space: nowrap; cursor: pointer; }
        .chirp-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }
        #chat-input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 24px; color: var(--text-main); outline: none; font-size: 0.95rem; transition: all 0.2s ease; }
        #chat-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .btn-disco { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; font-weight: bold; border: none; border-radius: 12px; padding: 10px; margin-bottom: 12px; width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3); }

        #floating-container { position: fixed; bottom: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; overflow: hidden; }
        .floating-emoji { position: absolute; bottom: -50px; font-size: 2rem; user-select: none; animation: floatUpAndFade 2.5s cubic-bezier(0.08, 0.8, 0.2, 1) forwards; opacity: 0; }
        @keyframes floatUpAndFade {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateY(-10vh) translateX(var(--random-x)) scale(1.2); }
            100% { transform: translateY(-105vh) translateX(calc(var(--random-x) * 2)) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>
<div class="container" id="login-screen">
    <h1>Sammu Games 🎮</h1>
    <input type="text" id="username" placeholder="Enter Username..." autocomplete="off">
    <label>Select Avatar Layout</label>
    <div class="avatar-select">
        <div class="avatar-opt selected" onclick="selectAvatar('🥷', this)">🥷</div>
        <div class="avatar-opt" onclick="selectAvatar('🤖', this)">🤖</div>
        <div class="avatar-opt" onclick="selectAvatar('🦁', this)">🦁</div>
        <div class="avatar-opt" onclick="selectAvatar('👽', this)">👽</div>
    </div>
    <button onclick="joinGame()">ENTER LOBBY</button>
</div>
<div class="container" id="game-screen" style="display:none;">
    <h1 id="room-title">Sammu Arena</h1>
    <button class="btn-disco" onclick="toggleDisco()">🪩 TOGGLE LOBBY DISCO MODE 🪩</button>

    <div id="score-display" class="score-board" style="display:none;">
        <div id="scoreA-text">🔴 Team A: 0</div>
        <div id="scoreB-text">🔵 Team B: 0</div>
    </div>
    
    <div id="draft-arena-zone" style="display:none;">
        <h3 id="draft-instructions" style="text-align:center; color:#ffc107; margin:5px 0; font-size:1rem;"></h3>
        <div class="team-arena">
            <div class="team-box red" id="box-teamA"><h4 id="head-teamA">Team A</h4><div id="list-teamA"></div></div>
            <div class="team-box blue" id="box-teamB"><h4 id="head-teamB">Team B</h4><div id="list-teamB"></div></div>
        </div>
    </div>

    <div id="battle-zone" style="display:none; text-align:center;">
        <h3 id="battle-status" style="color:#ff0055; padding: 8px; border-radius: 10px;">⚔️ Match Live ⚔️</h3>
        <div class="board" id="ttt-board"></div>
    </div>

    <div id="sumo-zone" style="display:none; text-align:center; padding:15px; margin:15px 0; background:#1c1c24; border-radius:16px; border:1px solid #444;">
        <h2 style="color:#ffcc00; font-size:1.1rem; margin:0 0 10px 0;">🤼 SUMO RING SMASH 🤼</h2>
        <div style="width:100%; height:32px; background:#0b0b0d; border-radius:16px; position:relative; overflow:hidden; margin:15px 0; border:2px solid #333;">
            <div style="position:absolute; left:50%; top:0; width:2px; height:100%; background:#fff; opacity:0.3;"></div>
            <div id="sumo-wrestler" style="position:absolute; top:2px; left:50%; width:26px; height:26px; background:#ffcc00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; transform:translateX(-13px); transition: left 0.08s ease-out;">🤼</div>
        </div>
        <button id="btn-sumo-push" onclick="socket.emit('sumoPush')" style="background:linear-gradient(135deg, #ffcc00, #ff9900); color:#000; font-size:1.3rem; font-weight:900;">TAP FAST TO PUSH! 🔥</button>
    </div>

    <div id="spinner-zone" style="display:none; text-align:center; padding:15px; margin:15px 0; background:#1c1c24; border-radius:16px; border:1px solid #a855f7;">
        <h2 style="color:#d8b4fe; font-size:1.1rem; margin:0 0 10px 0;">🌀 SPINNER.IO ARENA CLASH 🌀</h2>
        <div style="width:300px; height:300px; margin:0 auto; border-radius:50%; background:radial-gradient(circle, #1e1b4b 40%, #09090b 95%); border:4px solid #a855f7; position:relative; overflow:hidden; box-shadow: 0 0 25px rgba(168,85,247,0.4);">
            <div id="spin-a" style="position:absolute; width:44px; height:44px; border-radius:50%; background:conic-gradient(#ef4444, #991b1b, #fca5a5, #ef4444); border:2px solid #fff; left:90px; top:150px; transform:translate(-22px,-22px); animation: spinBlade 0.25s linear infinite; box-shadow: 0 0 12px #ef4444;"></div>
            <div id="spin-b" style="position:absolute; width:44px; height:44px; border-radius:50%; background:conic-gradient(#3b82f6, #1e40af, #93c5fd, #3b82f6); border:2px solid #fff; left:210px; top:150px; transform:translate(-22px,-22px); animation: spinBlade 0.25s linear infinite; box-shadow: 0 0 12px #3b82f6;"></div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3, 64px); gap:8px; justify-content:center; margin-top:14px;">
            <div></div>
            <button onclick="socket.emit('spinnerMove','up')" style="padding:14px; font-size:1.2rem; border-radius:12px;">⬆️</button>
            <div></div>
            <button onclick="socket.emit('spinnerMove','left')" style="padding:14px; font-size:1.2rem; border-radius:12px;">⬅️</button>
            <button onclick="socket.emit('spinnerMove','down')" style="padding:14px; font-size:1.2rem; border-radius:12px;">⬇️</button>
            <button onclick="socket.emit('spinnerMove','right')" style="padding:14px; font-size:1.2rem; border-radius:12px;">➡️</button>
        </div>
    </div>

    <div id="host-panel" style="display:none; background:#1c1c24; padding:15px; border-radius:16px; margin-bottom:15px; border: 1px solid #ffc107;">
        <h4 style="margin:0 0 10px 0; color:#ffc107; font-weight:800;">👑 HOST PANEL</h4>
        <label>Choose Captain A</label><select id="select-capA"></select>
        <label>Choose Captain B</label><select id="select-capB"></select>
        <button id="btn-captains" onclick="hostSubmitCaptains()" style="background:#ffc107; color:#000;">Appoint Selected Captains</button>
        <button id="btn-start-duel" onclick="hostStartDuel()" style="background:#00bcd4; display:block; margin: 4px 0;">Launch 1v1 Tic-Tac-Toe</button>
        <button id="btn-start-sumo" onclick="socket.emit('launchSumo')" style="background:#ffcc00; color:#000; display:block; margin: 4px 0;">Launch Sumo Speed Smash</button>
        <button id="btn-start-spinner" onclick="socket.emit('launchSpinner')" style="background:#a855f7; color:#fff; display:block; margin: 4px 0;">Launch Spinner.io Clash 🌀</button>
        <button onclick="hostReset()" style="background:#444; margin-top:8px;">Full Lobby Reset</button>
    </div>

    <div class="react-box">
        <button class="react-btn" onclick="sendReaction('🔥')">🔥</button>
        <button class="react-btn" onclick="sendReaction('👑')">👑</button>
        <button class="react-btn" onclick="sendReaction('🤡')">🤡</button>
        <button class="react-btn" onclick="sendReaction('💀')">💀</button>
    </div>
    <h3 id="list-header-title">Players in Room</h3>
    <div id="player-list"></div>
    
    <h3>Lobby Chat Room</h3>
    <div id="chat-area"></div>
    
    <div class="chirp-row">
        <button class="chirp-btn" onclick="sendQuickChirp('Loser! 🤫')">Loser! 🤫</button>
        <button class="chirp-btn" onclick="sendQuickChirp('EZ! 🥱')">EZ! 🥱</button>
        <button class="chirp-btn" onclick="sendQuickChirp('Go Team! 🔥')">Go Team! 🔥</button>
        <button class="chirp-btn" onclick="sendQuickChirp('Too Fast! ⚡')">Too Fast! ⚡</button>
    </div>

    <input type="text" id="chat-input" placeholder="Type tasks or messages..." onkeypress="handleChatKey(event)">
</div>
<div id="floating-container"></div>
<script src="/socket.io/socket.io.js"></script>
                           <script>
    const socket = io();
    let selectedAvatar = '🥷', myId = null, isIAmHost = false, currentPlayers = [], currentGameState = 'lobby', activeTurnPickerId = null, localUsername = "";
    
    function selectAvatar(a, el) { document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); selectedAvatar = a; }
    
    function joinGame() {
        const u = document.getElementById('username').value.trim(); if(!u) return alert("Enter name!");
        localUsername = u;
        localStorage.setItem('sammu_username', u);
        localStorage.setItem('sammu_avatar', selectedAvatar);
        document.getElementById('login-screen').style.display = 'none'; document.getElementById('game-screen').style.display = 'block';
        myId = socket.id; socket.emit('joinRoom', { username: u, avatar: selectedAvatar });
    }

    socket.on('connect', () => {
        const savedName = localStorage.getItem('sammu_username');
        const savedAvatar = localStorage.getItem('sammu_avatar');
        if (savedName && savedAvatar) {
            localUsername = savedName; selectedAvatar = savedAvatar;
            if(document.getElementById('login-screen')) document.getElementById('login-screen').style.display = 'none';
            if(document.getElementById('game-screen')) document.getElementById('game-screen').style.display = 'block';
            myId = socket.id; socket.emit('joinRoom', { username: savedName, avatar: savedAvatar });
        }
    });

    function toggleDisco() { document.body.classList.toggle('disco-active'); }
    function sendQuickChirp(t) { socket.emit('chatMessage', t); }

    function hostSubmitCaptains() {
        const capA = document.getElementById('select-capA').value;
        const capB = document.getElementById('select-capB').value;
        if(!capA || !capB) return alert("Pick Captain A and Captain B first! 🛑");
        socket.emit('makeCaptains', { capA, capB });
    }

    function hostStartDuel() {
        const capA = document.getElementById('select-capA').value;
        const capB = document.getElementById('select-capB').value;
        if(!capA || !capB) return alert("Pick Captain A and Captain B to start Tic-Tac-Toe! ⚔️");
        socket.emit('assignFighters', { fightA: capA, fightB: capB });
    }

    function hostReset() { socket.emit('resetToLobby'); }

    socket.on('initRole', (data) => {
        isIAmHost = data.isHost;
        document.getElementById('host-panel').style.display = isIAmHost ? 'block' : 'none';
        document.getElementById('room-title').innerText = isIAmHost ? "Sammu Games (HOST) 👑" : "Sammu Arena";
    });

    socket.on('updatePlayers', (p) => {
        currentPlayers = p;
        const selA = document.getElementById('select-capA'); const selB = document.getElementById('select-capB');
        const valA = selA.value; const valB = selB.value;
        selA.innerHTML = '<option value="">-- Choose Captain A --</option>'; selB.innerHTML = '<option value="">-- Choose Captain B --</option>';
        p.forEach(pl => {
            const optA = document.createElement('option'); optA.value = pl.id; optA.innerText = pl.username;
            const optB = document.createElement('option'); optB.value = pl.id; optB.innerText = pl.username;
            selA.appendChild(optA); selB.appendChild(optB);
        });
        selA.value = valA; selB.value = valB; renderPlayerList();
    });

    function renderPlayerList() {
        const list = document.getElementById('player-list'); list.innerHTML = '';
        currentPlayers.forEach(pl => {
            const card = document.createElement('div');
            const listA = document.getElementById('list-teamA') ? document.getElementById('list-teamA').innerText : '';
            const listB = document.getElementById('list-teamB') ? document.getElementById('list-teamB').innerText : '';
            const isDrafted = listA.includes(pl.username) || listB.includes(pl.username);
            if (currentGameState === 'drafting' && !isDrafted) {
                card.className = 'player-card selectable';
                if (myId === activeTurnPickerId) card.onclick = () => socket.emit('draftPlayer', pl.id);
            } else { card.className = 'player-card'; }
            card.innerHTML = `<span>${pl.avatar}</span> <b>${pl.username}</b> ${pl.isHost ? ' <i style="color:#ffc107;margin-left:5px;">(Host)👑</i>' : ''}`;
            list.appendChild(card);
        });
    }

    function handleChatKey(event) {
        if (event.key === 'Enter') {
            const input = document.getElementById('chat-input'); const msg = input.value.trim();
            if (!msg) return; socket.emit('chatMessage', msg); input.value = '';
        }
    }

    socket.on('message', (data) => {
        const chatArea = document.getElementById('chat-area'); const container = document.createElement('div');
        if (data.username === 'SYSTEM') {
            container.className = 'bubble-container msg-container-system';
            container.innerHTML = `<div class="msg-bubble">${data.text}</div>`;
        } else {
            const isMe = (data.username === localUsername);
            container.className = isMe ? 'bubble-container msg-container-outgoing' : 'bubble-container msg-container-incoming';
            const matchPlayer = currentPlayers.find(p => p.username === data.username);
            const userIcon = matchPlayer ? matchPlayer.avatar : '👤';
            const senderLabel = !isMe ? `<div class="msg-sender-title">${userIcon} ${data.username}</div>` : '';
            container.innerHTML = `${senderLabel}<div class="msg-bubble">${data.text}</div>`;
        }
        chatArea.appendChild(container); chatArea.scrollTop = chatArea.scrollHeight;
    });

    socket.on('incomingReaction', (emoji) => {
        const container = document.getElementById('floating-container') || document.body;
        for (let i = 0; i < 12; i++) {
            const el = document.createElement('div'); el.className = 'floating-emoji'; el.innerText = emoji;
            const randomLeft = Math.random() * 80 + 10; const randomXShift = (Math.random() * 120 - 60) + 'px';
            el.style.left = randomLeft + '%'; el.style.setProperty('--random-x', randomXShift);
            el.style.animationDelay = (Math.random() * 0.4) + 's'; container.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }
    });
    
    function sendReaction(emoji) { socket.emit('sendReaction', emoji); }

    socket.on('announceWinner', (data) => {
        alert(data.icon ? `GAME OVER! Winner: ${data.winner} ${data.icon}` : `GAME OVER: ${data.winner}!`);
    });

    socket.on('spinnerTick', (spin) => {
        const sA = document.getElementById('spin-a');
        const sB = document.getElementById('spin-b');
        if (sA) { sA.style.left = spin.a.x + 'px'; sA.style.top = spin.a.y + 'px'; }
        if (sB) { sB.style.left = spin.b.x + 'px'; sB.style.top = spin.b.y + 'px'; }
    });

    socket.on('syncGame', (gameData) => {
        currentGameState = gameData.gameState; activeTurnPickerId = gameData.currentTurnPicker;
        const hasStarted = (gameData.gameState !== 'lobby');
        
        if(document.getElementById('score-display')) {
            document.getElementById('score-display').style.display = hasStarted ? 'flex' : 'none';
            document.getElementById('scoreA-text').innerText = `🔴 Team A: ${gameData.scores.teamA}`;
            document.getElementById('scoreB-text').innerText = `🔵 Team B: ${gameData.scores.teamB}`;
        }
        if(document.getElementById('draft-arena-zone')) document.getElementById('draft-arena-zone').style.display = hasStarted ? 'block' : 'none';
        if(document.getElementById('sumo-zone')) document.getElementById('sumo-zone').style.display = (gameData.gameState === 'sumo') ? 'block' : 'none';
        if(document.getElementById('spinner-zone')) document.getElementById('spinner-zone').style.display = (gameData.gameState === 'spinner') ? 'block' : 'none';
        
        const battleZone = document.getElementById('battle-zone');
        if(battleZone) {
            battleZone.style.display = (gameData.gameState === 'duel') ? 'block' : 'none';
            if (gameData.gameState === 'duel' && gameData.tttBoard) {
                const tttBoard = document.getElementById('ttt-board'); const battleStatus = document.getElementById('battle-status');
                if (battleStatus && gameData.tttTurn) {
                    const activeFighter = currentPlayers.find(p => p.id === gameData.tttTurn);
                    battleStatus.innerText = activeFighter ? `⚔️ Turn: ${activeFighter.username} ⚔️` : `⚔️ Match Live ⚔️`;
                }
                if (tttBoard) {
                    tttBoard.innerHTML = '';
                    gameData.tttBoard.forEach((cellVal, idx) => {
                        const cellBtn = document.createElement('button'); cellBtn.className = 'cell';
                        cellBtn.style.width = '80px'; cellBtn.style.height = '80px'; cellBtn.style.margin = '4px';
                        cellBtn.style.fontSize = '1.8rem'; cellBtn.style.fontWeight = '900';
                        cellBtn.innerText = cellVal || ''; cellBtn.onclick = () => socket.emit('makeMove', idx);
                        tttBoard.appendChild(cellBtn);
                    });
                }
            }
        }
        
        const wrestler = document.getElementById('sumo-wrestler');
        if (wrestler && gameData.sumoPosition) { wrestler.style.left = gameData.sumoPosition + '%'; }

        if (!hasStarted) {
            if(document.getElementById('battle-zone')) document.getElementById('battle-zone').style.display = 'none';
            if(document.getElementById('list-teamA')) document.getElementById('list-teamA').innerHTML = ''; 
            if(document.getElementById('list-teamB')) document.getElementById('list-teamB').innerHTML = '';
        }
    });
</script>
</body>
</html>
