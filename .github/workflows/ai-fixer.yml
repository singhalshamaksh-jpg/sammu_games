name: ERNIE-5.5 Coding Auto-Fixer

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ERNIE-5.5 Coding Fixer
        env:
          HACKCLUB_AI_KEY: ${{ secrets.HACKCLUB_AI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_FULL: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const apiKey = (process.env.HACKCLUB_AI_KEY || "").trim();
            if (!apiKey) throw new Error("Missing HACKCLUB_AI_KEY secret");
            const base = ["https://ai", "hackclub", "com"].join(".") + "/proxy/v1";

            let codingModels = ["baidu/ernie-5.5-flash-preview:free"];
            try {
              const mRes = await fetch(base + "/models", { headers: { "Authorization": "Bearer " + apiKey } });
              if (mRes.ok) {
                const mData = await mRes.json();
                const otherFree = (mData.data || [])
                  .filter(m => m && m.id && !m.id.includes("particle-1") && (String(m.id).includes(":free") || (m.pricing && Number(m.pricing.prompt) === 0)))
                  .map(m => m.id);
                codingModels = [...new Set(["baidu/ernie-5.5-flash-preview:free", ...otherFree])];
              }
            } catch (e) {}

            const files = fs.readdirSync(".").filter(f => /\.(js|html|css|json)$/i.test(f) && f !== "package-lock.json" && f !== "ai_banks_cache.json");
            let bundle = "";
            for (const f of files) bundle += "\n=== FILE: " + f + " ===\n" + fs.readFileSync(f, "utf8") + "\n";

            const prompt = [
              "You are an expert full-stack Node.js & Socket.IO engineer. Fix this GitHub Issue cleanly without breaking any existing features.",
              "TITLE: " + (process.env.ISSUE_TITLE || ""),
              "BODY: " + (process.env.ISSUE_BODY || ""),
              "",
              "CODEBASE:",
              bundle,
              "",
              "CRITICAL RULES:",
              "1. In ===FILE_START: filename=== put ONLY the exact filename (e.g. server.js or multi_servers.js), NO extra text or parentheses.",
              "2. Output the ENTIRE, COMPLETE file from line 1 to the last line—NEVER output partial snippets or omit existing functions.",
              "3. Output each modified file ONCE.",
              "",
              "OUTPUT FORMAT:",
              "===SUMMARY===",
              "(1-2 sentence explanation of fixes)",
              "===END_SUMMARY===",
              "",
              "===FILE_START: exact_filename.js===",
              "(COMPLETE updated file from top to bottom)",
              "===FILE_END==="
            ].join("\n");

            let rawReply = "";
            let usedModel = "";
            let lastErr = "";

            for (const model of codingModels) {
              for (let attempt = 1; attempt <= 2; attempt++) {
                console.log("Trying " + model + " (attempt " + attempt + ")...");
                const res = await fetch(base + "/chat/completions", {
                  method: "POST",
                  headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
                  body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }], max_tokens: 120000, temperature: 0.15 })
                });
                if (res.ok) {
                  const data = await res.json();
                  const first = Array.isArray(data.choices) ? data.choices.at(0) : null;
                  rawReply = ((first && first.message && first.message.content) || "");
                  const thinkEnd = rawReply.indexOf("</think>");
                  if (thinkEnd !== -1) rawReply = rawReply.slice(thinkEnd + 8);
                  rawReply = rawReply.trim();
                  usedModel = model;
                  break;
                }
                lastErr = "HTTP " + res.status + " (" + model + "): " + (await res.text());
                if (res.status === 429) await sleep(3000);
                else break;
              }
              if (rawReply) break;
            }

            if (!rawReply) throw new Error(lastErr || "All free coding models busy");

            let summary = "Applied requested code fixes.";
            if (rawReply.includes("===SUMMARY===") && rawReply.includes("===END_SUMMARY===")) {
              summary = rawReply.split("===SUMMARY===").at(1).split("===END_SUMMARY===").at(0).trim();
            }

            const chunks = rawReply.split("===FILE_START:").slice(1);
            let updatedCount = 0;
            for (const chunk of chunks) {
              const headerEnd = chunk.indexOf("===");
              const fileEnd = chunk.indexOf("===FILE_END===");
              if (headerEnd === -1 || fileEnd === -1) continue;
              const rawHeader = chunk.slice(0, headerEnd).split("(").at(0).trim();
              const fileName = path.basename(rawHeader);
              let lines = chunk.slice(headerEnd + 3, fileEnd).replace(/^\r?\n/, "").split(/\r?\n/);
              if (lines.length && lines.at(0).trim().startsWith("```")) lines.shift();
              if (lines.length && lines.at(-1).trim().startsWith("```")) lines.pop();
              const content = lines.join("\n");
              if (fileName && fs.existsSync(fileName) && content.trim().length > 200) {
                fs.writeFileSync(fileName, content, "utf8");
                console.log("Wrote updated file: " + fileName);
                updatedCount++;
              }
            }

            if (updatedCount === 0) throw new Error("No valid ===FILE_START=== blocks found in AI reply");

            if (process.env.ISSUE_NUMBER) {
              const ghApi = ["https://api", "github", "com"].join(".") + "/repos/" + process.env.REPO_FULL + "/issues/" + process.env.ISSUE_NUMBER + "/comments";
              await fetch(ghApi, {
                method: "POST",
                headers: { "Authorization": "Bearer " + process.env.GITHUB_TOKEN, "Content-Type": "application/json", "User-Agent": "ERNIE-Coding-Bot" },
                body: JSON.stringify({ body: "🤖 **Fixed by " + usedModel + " (" + updatedCount + " file(s) updated)!**\n\n" + summary + "\n\n✅ Syntax checked & pushed directly to main!" })
              });
            }
          })().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Syntax Check Before Pushing
        run: |
          for f in *.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Commit & Push Directly to Main
        run: |
          git config user.name "ERNIE 5.5 Coding Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix: ERNIE-5.5 auto-patch for issue #${{ github.event.issue.number }}"
          git push
