name: Gemini Issue Coder

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  code-with-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ask Gemini to edit files
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: \${{ github.event.issue.title }}
          ISSUE_BODY: \${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          api_key = os.environ["GEMINI_API_KEY"]
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          instruction = (title + " " + body).strip()
          url = "https://googleapis.com" + api_key

          target_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", ".git", ".github")]
              for file in files:
                  if file.endswith((".js", ".html", ".css")):
                      if any(f in instruction.lower() for f in (file.lower(),)) or not any(ext in instruction.lower() for ext in (".js", ".html", ".css")):
                          target_files.append(os.path.join(root, file))

          for filepath in target_files:
              print("Processing " + filepath)
              with open(filepath, "r", encoding="utf-8") as f:
                  code = f.read()
              prompt = (
                  "You are editing " + filepath + " for a Node.js + Socket.io game website.\n"
                  "Task: " + instruction + "\n"
                  "Apply the requested change cleanly while keeping all existing code intact. "
                  "Output ONLY the raw complete file code with zero markdown formatting or explanations:\n\n" + code
              )
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"maxOutputTokens": 65536}
              }
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      result = json.loads(resp.read().decode("utf-8"))
                      fixed = result["candidates"][0]["content"]["parts"][0]["text"].strip()
                      if fixed.startswith("```"):
                          fixed = "\n".join(fixed.split("\n")[1:-1])
                      if fixed and fixed != code.strip():
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(fixed + "\n")
                          print("SUCCESS: Updated " + filepath)
                      else:
                          print("NO CHANGE: " + filepath)
              except Exception as e:
                  print("ERROR on " + filepath + ": " + str(e))
          EOF

      - name: Commit and push AI updates
        run: |
          git config user.name "Gemini AI"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI update from Issue" && git push)
