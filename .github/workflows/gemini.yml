name: Universal AI Code Patcher

on:
  issues:
    types: [opened]

permissions:
  contents: write
  models: read

jobs:
  ai-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply Smart AI Patch to Any File
        env:
          GROQ_API_KEY: \${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: \${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: \${{ github.event.issue.title }}
          ISSUE_BODY: \${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.error, sys, time

          groq_key = os.environ.get("GROQ_API_KEY", "").strip()
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          openrouter_key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          instruction = (os.environ.get("ISSUE_TITLE", "") + "\n" + os.environ.get("ISSUE_BODY", "")).strip()

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", ".git", ".github")]
              for file in files:
                  if file.endswith((".js", ".html", ".css")):
                      clean_path = os.path.join(root, file)
                      if clean_path.startswith("./"):
                          clean_path = clean_path[2:]
                      all_files.append(clean_path)

          mentioned = [f for f in all_files if os.path.basename(f).lower() in instruction.lower()]
          if not mentioned:
              mentioned = ["server.js"] if "server.js" in all_files else all_files[:1]

          def call_openai_compatible(url, api_key, model_name, prompt_text, extra_headers=None):
              payload = {
                  "model": model_name,
                  "messages": [{"role": "user", "content": prompt_text}],
                  "response_format": {"type": "json_object"},
                  "temperature": 0.1
              }
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "SammuGames-Patcher"
              }
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=180) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  return data["choices"][0]["message"]["content"].strip()

          def call_gemini(prompt_text):
              url = "https://googleapis.com" + gemini_key
              payload = {
                  "contents": [{"parts": [{"text": prompt_text}]}],
                  "generationConfig": {"responseMimeType": "application/json"}
              }
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=300) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  return data["candidates"][0]["content"]["parts"][0]["text"].strip()

          for filepath in mentioned:
              print("Patching file:", filepath)
              with open(filepath, "r", encoding="utf-8") as f:
                  code = f.read()

              prompt = (
                  "You are a senior Node.js and web developer editing " + filepath + ".\n"
                  "User Request:\n" + instruction + "\n\n"
                  "Output a JSON object containing a 'patches' array of exact search-and-replace blocks.\n"
                  "Format:\n"
                  '{"patches": [{"search": "exact existing lines from file", "replace": "new updated lines"}]}\n\n'
                  "Rules:\n"
                  "1. search MUST match existing lines in the file character-for-character (include 2-3 surrounding lines).\n"
                  "2. To add new code, include existing anchor lines in search and put existing + new lines in replace.\n"
                  "3. Properly escape all newlines (\\n) and quotes inside JSON strings.\n"
                  "4. If no changes are needed, return {\"patches\": []}.\n"
                  "5. Output ONLY valid raw JSON.\n\n"
                  "File Content (" + filepath + "):\n" + code
              )

              raw_json = None

              if groq_key and not raw_json:
                  try:
                      print("1. Trying Groq Llama-3.3-70B...")
                      raw_json = call_openai_compatible("https://groq.com", groq_key, "llama-3.3-70b-versatile", prompt)
                  except Exception as e:
                      print("Groq skipped:", e)

              if gemini_key and not raw_json:
                  try:
                      print("2. Trying Gemini 2.5 Flash...")
                      raw_json = call_gemini(prompt)
                  except Exception as e:
                      print("Gemini skipped:", e)

              if openrouter_key and not raw_json:
                  try:
                      print("3. Trying OpenRouter Qwen-2.5-Coder-32B (Free)...")
                      raw_json = call_openai_compatible(
                          "https://openrouter.ai",
                          openrouter_key,
                          "qwen/qwen-2.5-coder-32b-instruct:free",
                          prompt,
                          {"HTTP-Referer": "https://github.com", "X-Title": "SammuGames"}
                      )
                  except Exception as e:
                      print("OpenRouter skipped:", e)

              if gh_token and not raw_json:
                  try:
                      print("4. Trying Built-in GitHub Models (GPT-4o-mini)...")
                      raw_json = call_openai_compatible("https://azure.com", gh_token, "gpt-4o-mini", prompt)
                  except Exception as e:
                      print("GitHub Models skipped:", e)

              if not raw_json:
                  print("FAILED on", filepath)
                  sys.exit(1)

              if raw_json.startswith("```"):
                  raw_json = "\n".join(raw_json.split("\n")[1:-1]).strip()

              parsed = json.loads(raw_json, strict=False)
              patches = parsed.get("patches", parsed) if isinstance(parsed, dict) else parsed

              updated_code = code
              applied = 0
              for p in patches:
                  s, r = p.get("search", ""), p.get("replace", "")
                  if s and s in updated_code:
                      updated_code = updated_code.replace(s, r, 1)
                      applied += 1
                  else:
                      print("WARNING: Search block did not match:", s[:60])

              if applied > 0 and updated_code != code:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(updated_code)
                  print("SUCCESS: Applied patches to", filepath)
              else:
                  print("CLEAN: No changes needed for", filepath)
          EOF

      - name: Commit and push AI updates
        run: |
          git config user.name "Sammu AI Coder"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI patch from Issue" && git push)
