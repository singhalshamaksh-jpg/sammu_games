name: Particle-1 AI Direct Auto-Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  autofix:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Particle-1 AI Fixer
        env:
          HACKCLUB_AI_KEY: ${{ secrets.HACKCLUB_AI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_FULL: ${{ github.repository }}
        run: node .github/scripts/fix-issue.js

      - name: Syntax Check Before Pushing
        run: |
          for f in *.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Commit & Push Directly to Main
        run: |
          git config user.name "Particle-1 AI Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix: AI auto-patch for issue #${{ github.event.issue.number }}"
          git push
