name: Particle-1 AI Issue Auto-Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Particle-1 AI Fixer
        env:
          HACKCLUB_AI_KEY: ${{ secrets.HACKCLUB_AI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_FULL: ${{ github.repository }}
        run: node .github/scripts/fix-issue.js

      - name: Syntax Check Before PR
        run: |
          for f in *.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: AI patch for issue #${{ github.event.issue.number }}"
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
          title: "🤖 AI Fix: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: "Automated fix generated by `particle-ai/particle-1:free` for #${{ github.event.issue.number }}."
