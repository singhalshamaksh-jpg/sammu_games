<!DOCTYPE html>
<html>
<head>
    <title>Sammu Games</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-block-size: 100vh; }
        .hidden { display: none !important; }
        #login-box { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 2px solid #00ffcc; inline-size: 320px; text-align: center; }
        input, select { inline-size: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; }
        button { inline-size: 98%; padding: 12px; background: #00ffcc; border: none; border-radius: 6px; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; }
        #room { display: flex; flex-direction: column; align-items: center; inline-size: 100%; max-inline-size: 500px; }
        #game-map { inline-size: 320px; block-size: 320px; background: #1a1a1a; position: relative; border-radius: 50%; margin: 20px 0; border: 4px dashed #00ffcc; }
        .player { position: absolute; transform: translate(-50%, -50%); font-size: 14px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; }
        .host { top: 50%; left: 50%; font-weight: bold; color: #00ffcc; border: 2px solid #00ffcc; z-index: 10; }
        #chat-container { inline-size: 100%; background: #1e1e1e; border-radius: 8px; padding: 15px; }
        #chat-box { block-size: 180px; overflow-y: auto; text-align: left; margin-bottom: 10px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; margin: 0; }
        .chat-input-row button { inline-size: auto; padding: 0 20px; }
    </style>
</head>
<body>
    <div id="login-box">
        <h1 style="color: #00ffcc; margin-top: 0;">Sammu Games</h1>
        <input type="text" id="username" placeholder="Type Username...">
        <select id="avatar">
            <option value="🥷">Ninja 🥷</option>
            <option value="🤖">Robot 🤖</option>
            <option value="🦁">Lion 🦁</option>
            <option value="👽">Alien 👽</option>
        </select>
        <button id="start-btn">START GAME</button>
    </div>

    <div id="room" class="hidden">
        <h2 style="color: #00ffcc;">Lobby Room</h2>
        <div id="game-map">
            <div class="player host">👑 SAMMU (HOST)</div>
            <div id="player-layer"></div>
        </div>
        <div id="chat-container">
            <div id="chat-box"></div>
            <div class="chat-input-row">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        document.getElementById('start-btn').onclick = () => {
            const name = document.getElementById('username').value.trim();
            const av = document.getElementById('avatar').value;
            if(!name) return alert("Enter username!");
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('room').classList.remove('hidden');
            socket.emit('joinRoom', { username: name, avatar: av });
        };
        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(input.value.trim()) {
                socket.emit('chatMessage', input.value);
                input.value = '';
            }
        }
        socket.on('message', (data) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<p><span style="color: #00ffcc;">${data.username}:</span> ${data.text}</p>`;
            box.scrollTop = box.scrollHeight;
        });
        socket.on('updatePlayers', (players) => {
            const layer = document.getElementById('player-layer');
            layer.innerHTML = '';
            players.forEach((p, index) => {
                let angle = (index / players.length) * 2 * Math.PI;
                let x = 50 + 35 * Math.cos(angle);
                let y = 50 + 35 * Math.sin(angle);
                layer.innerHTML += `<div class="player" style="left:${x}%; top:${y}%;">${p.avatar} ${p.username}</div>`;
            });
        });
    </script>
</body>
</html>
