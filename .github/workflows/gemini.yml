name: Universal AI Code Patcher

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  ai-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply Smart AI Patch to Any File
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, sys

          api_key = os.environ["GEMINI_API_KEY"]
          instruction = (os.environ.get("ISSUE_TITLE", "") + "\n" + os.environ.get("ISSUE_BODY", "")).strip()
          host = "generativelanguage." + "googleapis.com"
          url = "https://" + host + "/v1beta/models/gemini-3.8-flash:generateContent?key=" + api_key

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", ".git", ".github")]
              for file in files:
                  if file.endswith((".js", ".html", ".css")):
                      clean_path = os.path.join(root, file)
                      if clean_path.startswith("./"):
                          clean_path = clean_path[2:]
                      all_files.append(clean_path)

          mentioned = [f for f in all_files if os.path.basename(f).lower() in instruction.lower()]
          if not mentioned:
              mentioned = ["server.js"] if "server.js" in all_files else all_files[:1]

          for filepath in mentioned:
              print("Patching file:", filepath)
              with open(filepath, "r", encoding="utf-8") as f:
                  code = f.read()

              prompt = (
                  "You are a senior Node.js and web developer editing " + filepath + ".\n"
                  "User Request:\n" + instruction + "\n\n"
                  "Output a JSON array of exact search-and-replace patches.\n"
                  "Format:\n"
                  '[{"search": "exact existing lines from file", "replace": "new updated lines"}]\n\n'
                  "Rules:\n"
                  "1. search MUST match existing lines in the file character-for-character (include 2-3 surrounding lines).\n"
                  "2. To add new code, include existing anchor lines in search and put existing + new lines in replace.\n"
                  "3. Output ONLY valid raw JSON with no markdown backticks.\n\n"
                  "File Content (" + filepath + "):\n" + code
              )

              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"responseMimeType": "application/json"}
              }
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})

              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      result = json.loads(resp.read().decode("utf-8"))
                      cand = result.get("candidates").pop(0)
                      part = cand.get("content").get("parts").pop(0)
                      raw_json = part.get("text").strip()
                      patches = json.loads(raw_json)

                      updated_code = code
                      applied = 0
                      for p in patches:
                          s, r = p.get("search", ""), p.get("replace", "")
                          if s and s in updated_code:
                              updated_code = updated_code.replace(s, r, 1)
                              applied += 1
                          else:
                              print("WARNING: Search block did not match:", s[:60])

                      if applied > 0 and updated_code != code:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(updated_code)
                          print("SUCCESS: Applied patches to", filepath)
                      else:
                          print("NO CHANGES APPLIED to", filepath)
                          sys.exit(1)
              except Exception as e:
                  print("ERROR:", e)
                  sys.exit(1)
          EOF

      - name: Commit and push AI updates
        run: |
          git config user.name "Gemini AI"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI patch from Issue" && git push)
